[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynixd-store"
version = "0.1.0"
description = "A local Nix store in Python: the file system, the database, the roots"
readme = "README.md"
requires-python = ">=3.13"
# PEP 639. The file is a copy of the one at the root of the repository: the
# source root of this project is this directory, and a path above it is not
# in the sdist.
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
    "aiosqlite",
    "anyio",
    "blake3",
    "libarchive-c",
    # Validates a derivation's `__json` without building Python objects: 16 ms for 16.8 MB, so the parse
    # thread holds the GIL briefly. `json.loads` and `pydantic_core.from_json` held it 0.3 s (nixidae/nixidae#1671).
    "msgspec",
    "nix-daemon-protocol>=0.1.0",
    # A store database on PostgreSQL (nixidae/nixidae#1209). Imported by `postgres_db.py` alone.
    "psycopg",
    "psycopg-pool",
    "pycurl",
    "pynacl",
    "seccomp; sys_platform == 'linux'",
    "structlog",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pynixd_store"]
