# The target, not a gate: 66 findings on 2026-09-16, which issue #131 works
# down. `ruff.toml` is what CI enforces.
#
# The shared strict rules extend `ruff.toml`, so the banned-api table and the
# isort groups live there alone. Without the isort groups ruff sorted this
# tree's own imports as third-party and raised 118 findings that were never
# real.
extend = "nix/shared/ruff-strict.toml"

[lint]
extend-select = ["TC"]
ignore = [
    # open-file-without-context-manager in http decompression generators
    # (generator assigns the handle then wraps with `with ctx as f:`)
    "SIM115",
]

[lint.per-file-ignores]
"tests/**" = ["ERA001", "RUF059", "F401", "T201", "ARG001"]
"tests/ai/**" = ["ERA001", "RUF059", "F401", "T201", "ARG001", "BLE001"]
"tests/conftest.py" = ["ERA001", "RUF059", "F401", "T201", "ARG001", "BLE001"]
