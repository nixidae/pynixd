jobs:
  docs-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
    - if: runner.os == 'Linux'
      name: Make room on the runner
      run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
      timeout-minutes: 10
      working-directory: /
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes read-only-local-store ca-derivations dynamic-derivations recursive-nix
          substituters = https://cache.nixos.org?priority=1 https://nixkube.cachix.org?priority=2 https://lillecarl.cachix.org?priority=3
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixkube.cachix.org-1:H8UE0jlI9pxHexK/NhDmEoLDarJXp1WTymQrsajlh7M= lillecarl.cachix.org-1:NN/LLMg7mbyvZCu32Qlo8LpSHqNw7Rr3VBCEYQvRpT0=
          trusted-users = root runner
        install_url: https://releases.nixos.org/nix/nix-2.34.8/install
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: lillecarl
        useDaemon: false
    - name: Build documentation
      run: nix build --file . docs.default --out-link result --print-build-logs --print-out-paths
    - name: Verify docs closure
      run: nix store verify --recursive --no-trust "$(readlink -f result)"
    - name: Prepare Pages artifact
      run: |
        mkdir -p public
        cp -r --no-preserve=mode,ownership result/. public/
    - uses: actions/upload-pages-artifact@v3
      with:
        path: public
    timeout-minutes: 20
  docs-deploy:
    concurrency:
      cancel-in-progress: false
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main'
    needs: docs-build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
    - id: deployment
      name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
name: Pages
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
