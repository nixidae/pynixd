[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynixd"
version = "0.1.0"
description = "Python Nix daemon protocol proxy over SSH"
requires-python = ">=3.13"
# PEP 639. The repository is Apache-2.0.
#
# The file is a copy of the one at the root of the repository, because the
# source root of this project is this directory, and a path above it is not in
# the sdist.
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
    "watchdog",
    "asyncssh",
    "aiohttp",
    "aiosqlite",
    "pyinstrument",
    "structlog",
    "passlib",
    "cachetools",
    "prometheus_client",
    "rich",
    "uvloop",
    "anyio",
    "nix-daemon-protocol>=0.1.0",
    # The six below were imported and not declared, and issue #131 found them.
    # A shell built from `shell.nix` supplied each one, so no import failed in
    # the repository this project came from. An install of the distribution
    # alone got as far as `import pynixd` and then raised ModuleNotFoundError
    # on `lz4`, which is what a consumer of the wheel would see.
    #
    # `pydantic` arrives through `nix-daemon-protocol` as well. It is here
    # because `config.py` and one other module import it directly, and a
    # dependency of a dependency is not a promise.
    "brotli",
    "lz4",
    "pynacl",
    "pydantic>=2",
    "pydantic-settings",
    "zstandard",
]

[project.optional-dependencies]
test = [
    "pytest",
    # **`environs` is a test dependency now, and it was a runtime one.**
    # `tests/_conftest/config.py` reads a binary path through it, which
    # `pynixd/CLAUDE.md` asks of a test. No module of the wheel imports it any
    # more: it answered four `env.int` and `env.str` calls with literal
    # defaults, nothing ever called `env.read_env()`, and it pulled
    # `marshmallow` and `python-dotenv` into every daemon start for 64 ms.
    # Issue #290.
    "environs",
]
# What `nix/docs.nix` builds the manual with. Declared here so that the
# development environment resolves them from this file rather than from a
# second list in Nix: `nix/shell.nix` named the same three by hand, and a
# list in two places is a list that disagrees with itself.
docs = [
    "sphinx",
    "myst-parser",
    "furo",
]

[project.scripts]
pynixd = "pynixd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pynixd"]

# Here and not in a `pytest.ini`. One used to sit beside this file, and
# `pytest.ini` wins over `pyproject.toml` whatever either says, so a setting
# added here would have been read by nobody.
[tool.pytest.ini_options]
addopts = "--tb=short"
log_cli = false
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
anyio_mode = "auto"
# Every thread's stack, when one test runs past this. The async timeout
# (`hooks.py`) is a `fail_after` and cannot fire while the loop is blocked
# or in a fixture: CI hung three times to its 45-minute limit with no trace
# (nixidae/nixidae#1019).
faulthandler_timeout = 300
markers = [
    "nixbuild: tests that require eu.nixbuild.net access",
    "nixbuildnet: tests that require nixbuild.net access",
    "store: tests using --store (pynixd as eval store)",
    "builders: tests using --builders (pynixd as remote builder)",
    "dag: tests building multi-layer DAG derivations",
    "slow: tests that are slow and should be excluded by default",
    "bench: benchmark tests that measure performance",
    "benchmark: dedicated performance measurement tests",
    "ca_derivations: tests requiring CA/dynamic derivation support",
    "legacy_nix_commands: tests using nix-store, nix-instantiate, etc.",
    "differential: builds one derivation through both goal systems and compares the stores",
]
