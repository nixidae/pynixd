[mypy]
python_version = 3.13
strict = True
explicit_package_bases = True
# tests/daemon/helpers is the daemon guest session's `pythonPath`.
mypy_path = ., nix-daemon-protocol/src, tests/daemon/helpers
files = pynixd, tests, docs/conf.py, nix/functional-tests/compare.py, nix/functional-tests/store-state.py
exclude = (^|/)result
