[mypy]
python_version = 3.13
strict = True
explicit_package_bases = True
# tests/daemon/helpers, tests/provisioning, tests/handover and tests/buildbarn are guest sessions' `pythonPath`.
mypy_path = ., nix-daemon-protocol/src, pynixd-store/src, pynixd-store/stubs, tests/daemon/helpers, tests/provisioning, tests/handover, tests/buildbarn, nix/shared
files = pynixd, tests, docs/conf.py, nix/functional-tests/compare.py, nix/functional-tests/setup.py, nix/functional-tests/store-state.py
exclude = (^|/)result
